const messages = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendButton = document.getElementById('sendButton');

function agregarMensaje(texto, clase) {
    const mensaje = document.createElement('div');
    mensaje.textContent = texto;
    mensaje.className = clase;
    messages.appendChild(mensaje);
    messages.scrollTop = messages.scrollHeight; // Desplazar hacia el último mensaje
}

function procesarPregunta(pregunta) {
    pregunta = pregunta.toLowerCase();
    for (let clave in respuestas) {
        if (pregunta.includes(clave)) {
            return respuestas[clave];
        }
    }
    return "Lo siento, no entiendo tu pregunta. Por favor, intenta nuevamente.";
}

sendButton.addEventListener('click', () => {
    const pregunta = userInput.value.trim();
    if (pregunta) {
        agregarMensaje("Tú: " + pregunta, "user");
        const respuesta = procesarPregunta(pregunta);
        agregarMensaje("Chatbot: " + respuesta, "bot");
        userInput.value = "";
    }
});

userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        sendButton.click();
    }
});
